[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexis"
version = "0.1.0"
description = "Lexis Agent: AI agent CLI by Osvyn, powered by the Lexis Cortex."
license = { text = "Apache-2.0" }
authors = [{ name = "Riki Wahyudi (Osvyn)" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
lexis = "lexis.cli:main"

[tool.setuptools]
packages = ["lexis", "lexis.cortex"]
