[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexis-agent"
version = "0.1.0"
description = "Lexis Agent: AI agent CLI by Osvyn, powered by the Lexis Cortex."
license = { text = "Apache-2.0" }
authors = [{ name = "Riki Wahyudi (Osvyn)" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "textual>=8.0",
]

[project.scripts]
lexis = "lexis.cli:main"

[tool.setuptools]
packages = ["lexis", "lexis.cortex", "lexis.visor", "lexis.skill_library"]

[tool.setuptools.package-data]
"lexis.visor" = ["theme.tcss"]
"lexis.skill_library" = ["*/SKILL.md"]
